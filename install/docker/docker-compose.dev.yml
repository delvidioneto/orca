# Orca – desenvolvimento (SQLite).
# Execute desta pasta: docker compose -f docker-compose.dev.yml up
# Ou da raiz do projeto: docker compose -f install/docker/docker-compose.dev.yml up

services:
  web:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: orca_web_dev
    ports:
      - "8000:8000"
    volumes:
      - ../..:/app
      - ../../scripts:/app/scripts
      - ../../logs:/app/logs
      - ../../media:/app/media
      - ../../data:/app/data
      - ../../staticfiles:/app/staticfiles
    environment:
      - DEBUG=True
      - CREATE_SUPERUSER=true
      - ORCA_VERSION=${ORCA_VERSION:-0.0.0}
      - DATABASE=sqlite
      - TIME_ZONE=America/Sao_Paulo
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  db:
    image: postgres:15-alpine
    container_name: orca_db
    profiles:
      - postgres
    environment:
      - POSTGRES_DB=orca
      - POSTGRES_USER=orca
      - POSTGRES_PASSWORD=${DB_PASSWORD:-orca123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orca"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
